<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Game The Time - tests</title>
    <link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-2.24.1.css" />
</head>
<body>
    <div id="qunit"></div>
    <div id="qunit-fixture"></div>

    <script>window.testmode = true;</script>
    <script src="https://code.jquery.com/qunit/qunit-2.24.1.js"></script>
    <script src="../assets/js/badgeService.js"></script>
    <script src="../assets/js/highscoreService.js"></script>
    <script src="../assets/js/streakService.js"></script>
    <script src="../assets/js/dailyChallengeService.js"></script>
    <script src="../assets/js/collectionService.js"></script>
    <script src="../assets/js/timescore.js"></script>
    <script src="tests.js"></script>
    <script>
        // Every scoring minute of today, for eyeballing the rules.
        (function printAllCombinations() {
            var current = new Date();
            current.setHours(0, 0, 0, 0);

            var ts = new TimeScore();
            var day = current.getDate();
            var pre = document.createElement("pre");
            var lines = [];

            while (current.getDate() == day) {
                var result = ts.getScore(current);

                if (result.points > 0) {
                    var pad = result.points < 10 ? " " : "";
                    lines.push(result.minuteKey + "  " + result.time + "\t" + pad + result.points + " points [" +
                        result.score.map(function (s) { return s.rule; }).join(", ") + "]");
                }

                current = new Date(current.getTime() + 60000);
            }

            pre.textContent = lines.join("\n");
            document.body.appendChild(pre);
        })();
    </script>
</body>
</html>
